[advisories]
db-path = "~/.cargo/advisory-db"
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"

[licenses]
# Permissive only. AGPL, GPL and LGPL are deliberately absent: the service
# must never absorb a copyleft runtime dependency.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "LicenseRef-SySL-1.0",
]
confidence-threshold = 0.8
# Workspace crates are publish = false.
private = { ignore = true }

# The family's own ORM (currently consumed from its git master) carries the
# SySL 1.0 text via license-file; the hash pins it so a swapped license
# would fail loudly.
[[licenses.clarify]]
name = "lacrymira"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "lacrymira-macros"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "lacrymira-pg"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Registry fallback (see Cargo.toml): the family ORM master carries the
# find/insert helpers the service is built on.
allow-git = ["https://github.com/celestia-island/lacrymira"]
