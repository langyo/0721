[advisories]
db-path = "~/.cargo/advisory-db"
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
ignore = [
    # RUSTSEC-2023-0071 (Marvin Attack, RSA timing sidechannel; no patched
    # release): `rsa` arrives only transitively, via jsonwebtoken (kirino's
    # ID-token verification — RS256 verification with a decoded public key,
    # never the attacked private-key decryption path). The family's OAuth
    # transport pulls kirino, so this advisory came in with it. Revisit when
    # the advisory gains a patched release (chest's precedent).
    { id = "RUSTSEC-2023-0071", reason = "no patched rsa release; transitive-only verification path exposes no RSA decryption oracle" },
    # RUSTSEC-2026-0543 (chrono unmaintained, issued 2026-11-17): kirino's
    # relying-party core declares its attempt deadlines as
    # `chrono::DateTime<Utc>`, so a host implementing `LoginAttemptStore` must
    # speak chrono. That is the ONLY reason chrono is a direct dependency
    # here (every other timestamp in this service is jiff); drop this ignore
    # when kirino's contract moves to jiff. EXPIRY: 2027-01-31.
    { id = "RUSTSEC-2026-0543", reason = "kirino's LoginAttemptStore contract is chrono-typed; remove when kirino moves to jiff. Expiry 2027-01-31." },
    # RUSTSEC-2026-0387 (constant-time operations in crypto-bigint 0.5.5):
    # crypto-bigint reaches us only through elliptic-curve 0.13 < p256/p384 <
    # jsonwebtoken < kirino, all of it pulled by the OAuth core's ID-token
    # verification. There is no in-tree fix: jsonwebtoken 11.1.0 (latest)
    # still requires p256 ^0.13, so raising it cannot reach elliptic-curve
    # 0.14 / crypto-bigint 0.7. This service's identity comes from UserInfo
    # responses and its own HS256 session signer, so the affected ECC
    # operations are never exercised. Revisit when jsonwebtoken moves to
    # elliptic-curve 0.14 (the same entry the family's arona carries).
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint comes only via jsonwebtoken < kirino; no in-tree fix, and no affected ECC operation is performed here. Expiry 2027-01-31." },
]

[licenses]
# Permissive only. AGPL, GPL and LGPL are deliberately absent: the service
# must never absorb a copyleft runtime dependency.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    # webpki-roots (reqwest's rustls-tls): the packaged Mozilla root
    # store carries the Community Data License Agreement Permissive 2.0
    # — a permissive data license, no copyleft obligations.
    "CDLA-Permissive-2.0",
    "LicenseRef-SySL-1.0",
]
confidence-threshold = 0.8
# Workspace crates are publish = false.
private = { ignore = true }

# The family's own ORM (crates.io since 0.2) carries the SySL 1.0 text via
# license-file; the hash pins it so a swapped license would fail loudly.
[[licenses.clarify]]
name = "lacrymira"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "lacrymira-macros"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "lacrymira-pg"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

# The family's JSON-RPC framework (crates.io): plana + its rpc-server
# carry the same SySL 1.0 text via license-file (hash-pinned below, the
# chest precedent). Allowed as a first-party family license — same
# publisher as the workspace's own crates, not a third-party copyleft
# risk (the AGPL/GPL/LGPL exclusion targets external runtime deps).
[[licenses.clarify]]
name = "plana"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0xda2b7c13 }]

[[licenses.clarify]]
name = "plana-rpc-server"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0xda2b7c13 }]

# The family's auth platform (crates.io): kirino and its derive crate carry
# the same SySL 1.0 text via license-file, byte-identical to plana's (hash
# pinned below). Allowed as a first-party family license — same publisher as
# the workspace's own crates, not a third-party copyleft risk (the
# AGPL/GPL/LGPL exclusion targets external runtime deps).
[[licenses.clarify]]
name = "kirino"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x629cea03 }]

[[licenses.clarify]]
name = "kirino-macro"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x629cea03 }]

# plana's HTTP transport for kirino's OAuth core (git master): same SySL 1.0
# text as the plana/plana-rpc-server rows above, hence the same hash.
[[licenses.clarify]]
name = "plana-identity-relay"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "../../LICENSE", hash = 0xda2b7c13 }]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# plana + plana-rpc-server stay on git: the published rpc-server still
# pairs with plana ^0.3. lacrymira is on crates.io and needs no allow-git.
allow-git = [
    "https://github.com/celestia-island/plana",
]
