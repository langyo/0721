<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>0721</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #5b4a4f;
        background: #faf3ec url("/bg.webp") center / cover no-repeat fixed;
      }
      .card {
        background: rgba(255, 250, 244, 0.86);
        border-radius: 16px;
        padding: 32px 40px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(91, 74, 79, 0.18);
        backdrop-filter: blur(6px);
      }
      img { width: 128px; height: 128px; border-radius: 24px; }
      h1 { font-size: 22px; margin: 16px 0 6px; }
      p { font-size: 14px; margin: 4px 0; opacity: 0.85; }
      code { font-size: 12px; background: rgba(91, 74, 79, 0.08); padding: 2px 6px; border-radius: 6px; }
      @media (prefers-color-scheme: dark) {
        body { color: #efe2da; }
        .card { background: rgba(43, 34, 38, 0.82); }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/logo.webp" alt="0721" />
      <h1>0721</h1>
      <p>The panel is being rebuilt on the new stack.</p>
      <p>Media links and the API keep serving during the transition.</p>
      <p><code>/media/&lt;hash&gt;</code></p>
    </main>
  </body>
</html>
