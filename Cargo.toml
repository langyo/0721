[workspace]
members = ["packages/*"]
resolver = "2"

[profile.release]
lto = true
opt-level = 'z'
codegen-units = 1
panic = "abort"

[workspace.package]
authors = ["langyo <langyo.china@gmail.com>"]
publish = false
license = "Apache-2.0"
rust-version = "1.94"

version = "0.4.0"
edition = "2021"

[workspace.dependencies]
# internal
i0721-proto = { path = "packages/proto", version = "^0.4" }
i0721-store = { path = "packages/store", version = "^0.4" }

# serialization
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"

# async / http
tokio = { version = "^1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "fs",
] }
axum = { version = "^0.8", features = ["multipart"] }
tower = { version = "^0.5", features = ["util"] }
tower-http = { version = "^0.7", features = ["compression-gzip", "fs", "limit"] }
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

# data access (family ORM; timestamps are jiff — chrono is absent by design).
# REGISTRY FALLBACK: lacrymira/lacrymira-pg 0.1.0 as published on crates.io
# are a stale, mutually incompatible pair (the core predates uuid/jiff model
# typing; the pg driver predates the find/insert helpers). Until a coherent
# version is published, pin the family git master (Cargo.lock pins the rev).
lacrymira = { git = "https://github.com/celestia-island/lacrymira", branch = "master", version = "0.1" }
lacrymira-pg = { git = "https://github.com/celestia-island/lacrymira", branch = "master", version = "0.1" }

# misc
async-trait = "^0.1"
bytes = "^1"
thiserror = "^2"
uuid = { version = "^1", features = ["v4", "fast-rng", "serde"] }
jiff = { version = "^1", features = ["serde"] }
base64 = "^0.22"

# auth (transition password + HS256 token)
argon2 = "^0.5"
password-hash = { version = "^0.5", features = ["getrandom"] }
hmac = "^0.12"
ipnet = "^2"
sha2 = "^0.10"

# media pipeline
image = { version = "^0.25", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
] }
webp = "^0.3"
webp-animation = "^0.9"
mime_guess = "^2"

# request-side parsing
url = "^2"

[workspace.lints.rust]
unsafe_code = "deny"
