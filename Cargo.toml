[workspace]
members = ["packages/*"]
# packages/webui is the pnpm (node) package — not a crate.
exclude = ["packages/webui"]
resolver = "2"

[profile.release]
lto = true
opt-level = 'z'
codegen-units = 1
panic = "abort"

[workspace.package]
authors = ["langyo <langyo.china@gmail.com>"]
publish = false
license = "Apache-2.0"
rust-version = "1.94"

version = "0.4.0"
edition = "2021"

[workspace.dependencies]
# internal
i0721-proto = { path = "packages/proto", version = "^0.4" }
i0721-store = { path = "packages/store", version = "^0.4" }

# serialization
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"

# async / http
tokio = { version = "^1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "fs",
] }
axum = { version = "^0.8", features = ["multipart"] }
tower = { version = "^0.5", features = ["util"] }
tower-http = { version = "^0.7", features = ["compression-gzip", "fs", "limit"] }
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

# data access (family ORM; timestamps are jiff — chrono is absent by design).
# Registry line: 0.2 resolves a coherent published pair (the 0.1.0 pair was
# mutually incompatible, which is why the git pin existed).
lacrymira = "^0.2"
lacrymira-pg = "^0.2"

# misc
async-trait = "^0.1"
bytes = "^1"
thiserror = "^2"
uuid = { version = "^1", features = ["v4", "fast-rng", "serde"] }
jiff = { version = "^1", features = ["serde"] }
base64 = "^0.22"

# Rust→TS contract (proto DTOs + server wire types feed the webui; the
# generated bindings under packages/webui/src/types are committed and
# drift-checked — never hand-write them).
ts-rs = { version = "^12", features = ["uuid-impl"] }

# auth (transition password + HS256 token)
argon2 = "^0.5"
password-hash = { version = "^0.5", features = ["getrandom"] }
hmac = "^0.12"
ipnet = "^2"
sha2 = "^0.10"

# media pipeline
image = { version = "^0.25", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
] }
webp = "^0.3"
webp-animation = "^0.9"
mime_guess = "^2"

# request-side parsing
url = "^2"

# web UI embedding (server feature `embedded-frontend`)
include_dir = "^0.7"

futures = "^0.3"

# SSE streaming for the MCP transport.
async-stream = "^0.3"

# S3-compatible blob backend (Apache-2.0; aws feature covers sigv4
# against minio/R2/AWS).
object_store = { version = "^0.12", features = ["aws"] }

# The OS RNG primitive (share tokens).
getrandom = "^0.3"

# Server-side OAuth calls (token exchange + OIDC discovery).
reqwest = { version = "^0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# Dev-only: the WS-frame integration tests (the family's own dev lane).
tokio-tungstenite = "^0.30"

# WebSocket JSON-RPC lane (the family's strict server framework; the
# /api/v1 REST surface retires down to the bootstrap/binary whitelist).
# `plana` itself carries the JSON-RPC wire types the handlers speak.
#
# REGISTRY FALLBACK (the lacrymira pattern): the published
# plana-rpc-server 0.2.0 depends on plana ^0.3 — a stale line against
# the family's current plana 0.8 (family-versions correctly refuses the
# mismatch), and no 0.8-paired rpc-server release exists yet. Until it
# ships, pin the family git master (Cargo.lock pins the rev) and flip
# back to crates.io declarations when the pair publishes.
plana-rpc-server = { git = "https://github.com/celestia-island/plana", branch = "master", version = "0.2" }
plana = { git = "https://github.com/celestia-island/plana", branch = "master", version = "0.8" }

[workspace.lints.rust]
unsafe_code = "deny"
