[package]
name = "i0721-server"
description = "The 0721 resource service (axum 0.8 + tokio)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "i0721-server"
path = "src/main.rs"

[dependencies]
i0721-proto = { workspace = true }
i0721-store = { workspace = true }

async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
hmac = { workspace = true }
ipnet = { workspace = true }
sha2 = { workspace = true }
image = { workspace = true }
jiff = { workspace = true }
mime_guess = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
webp = { workspace = true }
webp-animation = { workspace = true }
ts-rs = { workspace = true }
plana-rpc-server = { workspace = true }
plana = { workspace = true }
reqwest = { workspace = true }
object_store = { workspace = true }
async-stream = { workspace = true }
include_dir = { workspace = true, optional = true }

[dev-dependencies]
i0721-proto = { workspace = true }
i0721-store = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true

[features]
# Compile the web UI dist into the binary (include_dir!). ON by default:
# the shipped image is a single self-contained artifact. The cost is a
# compile-time dependency on `dist/webui` — `just webui` (or any
# packages/webui build) produces it; build with
# `--no-default-features` for a pure-API dev loop without a frontend.
default = ["embedded-frontend"]
embedded-frontend = ["include_dir"]
