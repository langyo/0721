name: Verify Versions

on:
  # Basic check (sub-minute, no compile): runs after a squash merge, never on
  # the pull request itself (2026-11-06 trigger policy).
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  verify-versions:
    uses: celestia-island/celestia-devtools/.github/workflows/verify-versions.yml@7440a4546a0699201214e4fa76836ef9df05fa74
    with:
      devtools-ref: 7440a4546a0699201214e4fa76836ef9df05fa74
      runner: '["ubuntu-latest"]'
