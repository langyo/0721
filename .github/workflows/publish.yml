name: Publish docker image
on:
  push:
    tags: [v*]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # The panel footer shows `<version> <branch>:<hash7>`; this job's
      # checkout HAS git, the docker build context does not, so the identity
      # is resolved here and handed in (celestia-erp's contract).
      - name: Resolve the build identity
        id: identity
        run: |
          branch="${GITHUB_REF_NAME}"
          case "${GITHUB_REF}" in
            refs/tags/*) branch="master" ;;
          esac
          echo "value=${branch}:$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PANEL_BUILD_IDENTITY=${{ steps.identity.outputs.value }}
