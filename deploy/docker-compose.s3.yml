# 0721 resource service — S3/MinIO deployment variant.
#
#   docker compose -f deploy/docker-compose.s3.yml up -d --build
#
# Required environment (put them in an env file next to this compose file):
#   I0721_JWT_SECRET     — the HS256 secret
#   POSTGRES_PASSWORD    — the PostgreSQL password for the 0721 role
name: i0721-s3

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: i0721
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: i0721
    volumes:
      - i0721-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U i0721 -d i0721"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - i0721-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/i0721-blobs &&
        echo 'bucket ready'
      "

  service:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${I0721_PUBLISH:-127.0.0.1:8080}:8080"
    environment:
      I0721_DATABASE_URL: postgres://i0721:${POSTGRES_PASSWORD}@postgres:5432/i0721
      JWT_SECRET: ${I0721_JWT_SECRET:?set I0721_JWT_SECRET}
      I0721_LISTEN: 0.0.0.0:8080
      I0721_STORAGE_BACKEND: s3
      I0721_S3_ENDPOINT: http://minio:9000
      I0721_S3_BUCKET: i0721-blobs
      I0721_S3_REGION: auto
      I0721_S3_ACCESS_KEY: minioadmin
      I0721_S3_SECRET_KEY: minioadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

volumes:
  i0721-pgdata:
  i0721-minio:
